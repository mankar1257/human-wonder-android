<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    this.state = { name: '' };
    this._orbitRef = (el) => { this.orbitEl = el; };
    this._trailsRef = (el) => { this.trailsEl = el; };
    this._pulses = [];
  }

  componentDidMount() {
    this._t0 = performance.now();
    this._last = 0;
    var loop = (now) => {
      this._raf = requestAnimationFrame(loop);
      if (now - this._last < 32) return;
      this._last = now;
      this.drawTrails(now);
      this.drawOrbit(now);
    };
    this._raf = requestAnimationFrame(loop);
  }

  componentWillUnmount() {
    cancelAnimationFrame(this._raf);
  }

  // A long-exposure star-trail sky: every star draws an arc around the pole star, and the whole
  // sky turns slowly. The trails are drawn once into an offscreen canvas, then rotated each frame.
  buildTrails(w, h, scale) {
    var px = 0.5 * w, py = 0.42 * h;
    var maxR = Math.max(Math.hypot(px, py), Math.hypot(w - px, py), Math.hypot(px, 0.8 * h - py), Math.hypot(w - px, 0.8 * h - py));
    var size = Math.ceil(2 * maxR + 8);
    var off = document.createElement('canvas');
    off.width = Math.round(size * scale);
    off.height = Math.round(size * scale);
    var g = off.getContext('2d');
    g.scale(scale, scale);
    g.lineCap = 'round';
    var seed = 412;
    var rand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
    var palette = [
      [255, 255, 255, 34], [196, 216, 255, 26], [255, 222, 176, 15],
      [255, 186, 128, 10], [176, 255, 238, 8], [214, 196, 255, 7],
    ];
    var pick = () => {
      var r = rand() * 100, acc = 0;
      for (var i = 0; i < palette.length; i++) { acc += palette[i][3]; if (r <= acc) return palette[i]; }
      return palette[0];
    };
    var c = size / 2;
    var sweep = 0.85;
    for (var n = 0; n < 950; n++) {
      var r = Math.sqrt(rand()) * maxR;
      if (r < 6) continue;
      var a0 = rand() * Math.PI * 2;
      var col = pick();
      var bright = 0.16 + Math.pow(rand(), 3) * 0.8;
      var width = 0.5 + rand() * rand() * 1.4;
      g.lineWidth = width;
      for (var j = 0; j < 10; j++) {
        var alpha = bright * Math.pow(1 - j / 10, 1.5);
        g.strokeStyle = 'rgba(' + col[0] + ', ' + col[1] + ', ' + col[2] + ', ' + alpha.toFixed(3) + ')';
        g.beginPath();
        g.arc(c, c, r, a0 + sweep * j / 10, a0 + sweep * (j + 1) / 10);
        g.stroke();
      }
    }
    this._trails = { canvas: off, size: size, px: px, py: py };
  }

  drawTrails(now) {
    var c = this.trailsEl;
    if (!c) return;
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    var w = c.clientWidth || 390;
    var h = c.clientHeight || 844;
    if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) {
      c.width = Math.round(w * dpr);
      c.height = Math.round(h * dpr);
      this.buildTrails(w, h, dpr);
    }
    var t = this._trails;
    var ctx = c.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    var seconds = (now - this._t0) / 1000;
    var fade = Math.min(1, seconds / 1.6);
    ctx.globalAlpha = fade;
    ctx.save();
    ctx.translate(t.px, t.py);
    ctx.rotate(-seconds * (Math.PI * 2 / 360));
    ctx.drawImage(t.canvas, -t.size / 2, -t.size / 2, t.size, t.size);
    ctx.restore();
    // Your star at the pole: it brightens as you write your name, and each letter sends a ring out.
    var lit = Math.min(1, this.state.name.length / 8);
    var tw = 0.85 + 0.15 * Math.sin(now / 420);
    var glowR = 14 + 16 * lit;
    var glow = ctx.createRadialGradient(t.px, t.py, 0, t.px, t.py, glowR);
    glow.addColorStop(0, 'rgba(200, 255, 245, ' + ((0.35 + 0.45 * lit) * tw).toFixed(3) + ')');
    glow.addColorStop(1, 'rgba(131, 255, 229, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(t.px, t.py, glowR, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(t.px, t.py, 1.8 + 1.2 * lit, 0, Math.PI * 2); ctx.fill();
    this._pulses = this._pulses.filter((p) => now - p < 1400);
    for (var i = 0; i < this._pulses.length; i++) {
      var q = (now - this._pulses[i]) / 1400;
      ctx.strokeStyle = 'rgba(131, 255, 229, ' + (0.5 * (1 - q)).toFixed(3) + ')';
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(t.px, t.py, 6 + 64 * q, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  // Orbit 412 crossing the sky like a satellite streak on a long exposure.
  drawOrbit(now) {
    var c = this.orbitEl;
    if (!c) return;
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    var w = c.clientWidth || 390;
    var h = c.clientHeight || 844;
    if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) {
      c.width = Math.round(w * dpr);
      c.height = Math.round(h * dpr);
    }
    var ctx = c.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    var arcY = 0.62 * h, drop = 0.03 * h;
    var p0x = -0.12 * w, p0y = arcY + drop, p1x = 0.5 * w, p1y = arcY - drop, p2x = 1.12 * w, p2y = arcY + drop;
    var at = (u) => {
      var a = (1 - u) * (1 - u), b = 2 * (1 - u) * u, q = u * u;
      return [a * p0x + b * p1x + q * p2x, a * p0y + b * p1y + q * p2y];
    };
    var circle = (x, y, r) => { ctx.beginPath(); ctx.arc(x, y, Math.max(0.1, r), 0, Math.PI * 2); };
    var travel = ((now - this._t0) / 60000 + 0.18) % 1;
    var u = 0.08 + 0.84 * travel;
    var sat = at(u);
    for (var k = 1; k <= 18; k++) {
      var pt = at(Math.max(0, u - k * 0.004));
      ctx.fillStyle = 'rgba(131, 255, 229, ' + (0.32 * (1 - k / 19)).toFixed(3) + ')';
      circle(pt[0], pt[1], 2.0 - k * 0.09);
      ctx.fill();
    }
    var glow = ctx.createRadialGradient(sat[0], sat[1], 0, sat[0], sat[1], 13);
    glow.addColorStop(0, 'rgba(131, 255, 229, 0.5)');
    glow.addColorStop(1, 'rgba(131, 255, 229, 0)');
    ctx.fillStyle = glow;
    circle(sat[0], sat[1], 13);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    circle(sat[0], sat[1], 2.3);
    ctx.fill();
    ctx.font = '500 11px Geist, system-ui, sans-serif';
    ctx.textBaseline = 'top';
    ctx.fillStyle = 'rgba(236, 239, 240, 0.78)';
    ctx.fillText('Orbit 412', sat[0] + 9, sat[1] + 7);
  }

  renderVals() {
    return {
      orbitRef: this._orbitRef,
      trailsRef: this._trailsRef,
      name: this.state.name,
      onName: (e) => {
        var v = e.target.value.slice(0, 40);
        if (v.length > this.state.name.length) this._pulses.push(performance.now());
        this.setState({ name: v });
      },
    };
  }
}
</script>
