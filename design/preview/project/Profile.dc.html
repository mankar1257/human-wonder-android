.hw-pulse { animation: hw-pulse 0.8s ease-in-out infinite alternate; }

.hw-kb { animation: hw-kb 24s ease-in-out infinite alternate; transform-origin: 50% 50%; }

.hw-breathe { animation: hw-breathe 3.2s ease-in-out infinite alternate; }

.hw-rise { animation: hw-rise 1.4s cubic-bezier(0.2, 0.7, 0.2, 1) both; }

.hw-spin { position: absolute; left: 0; top: 0; right: 0; bottom: 0; animation: hw-spin 9s linear infinite; }
@keyframes hw-spin { to { transform: rotate(360deg); } }
.hw-wavebox { display: block; overflow: hidden; transform: scaleY(0.06); transition: transform 0.7s ease; -webkit-mask-image: linear-gradient(90deg, transparent, #000 30%, #000 70%, transparent); mask-image: linear-gradient(90deg, transparent, #000 30%, #000 70%, transparent); }

.hw-wave { display: block; animation: hw-wave 1.1s linear infinite; }
@keyframes hw-wave { from { transform: translateX(0); } to { transform: translateX(-46px); } }
.hw-acq { display: block; width: 5px; height: 5px; border-radius: 50%; background: #83ffe5; margin-right: 5px; animation: hw-acq 1.5s linear infinite; }
@keyframes hw-acq { 0% { opacity: 1; } 33.3% { opacity: 0.4; } 33.4% { opacity: 0.25; } 100% { opacity: 0.25; } }
.hw-caret { animation: hw-blink 0.52s ease-in-out infinite alternate; }
@keyframes hw-blink { from { opacity: 1; } to { opacity: 0.15; } }
.hw-fadein { animation: hw-fadein 0.9s ease both; }
@keyframes hw-fadein { from { opacity: 0; } to { opacity: 1; } }
.hw-glow { animation: hw-glow 2.2s ease-in-out infinite alternate; }
@keyframes hw-glow { from { box-shadow: 0 0 22px rgba(47, 230, 200, 0.30); } to { box-shadow: 0 0 38px rgba(47, 230, 200, 0.50); } }

.hw-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.hw-noscroll { scrollbar-width: none; }
.hw-noscroll::-webkit-scrollbar { display: none; }
textarea::placeholder { color: #8d9997; }
.hw-shimmer { background: linear-gradient(90deg, #7f8b89 0%, #7f8b89 35%, #f1f4f4 50%, #7f8b89 65%, #7f8b89 100%); background-size: 260% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: hw-shimmer 1.8s linear infinite; }

.hw-iconbtn { border: 0; padding: 0; background: transparent; display: flex; align-items: center; justify-content: center; border-radius: 50%; }

input::placeholder { color: rgba(186, 202, 196, 0.45); }

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"name":{"editor":"text","default":"Wanderer"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    this.state = { name: ((this.props && this.props.name) || '').trim(), email: '', city: '', view: 'orbit', tone: 0, voice: false, haptics: true };
  }

  sw(on) {
    return {
      On: on,
      Track: on ? '#83ffe5' : 'rgba(255, 255, 255, 0.10)',
      Border: on ? '#83ffe5' : 'rgba(255, 255, 255, 0.35)',
      Thumb: on ? '#00201a' : 'rgba(255, 255, 255, 0.75)',
      Left: on ? '24px' : '6px',
      Knob: on ? '22px' : '16px',
    };
  }

  renderVals() {
    var s = this.state;
    var name = s.name.trim() || (this.props.name || '').trim() || 'Wanderer';
    var orbit = s.view === 'orbit';
    var vals = {
      name: s.name, email: s.email, city: s.city, displayName: name,
      initial: name.charAt(0).toUpperCase(),
      emailLine: s.email.trim() || 'Your Human Wonder profile',
      on_name: (e) => this.setState({ name: e.target.value.slice(0, 40) }),
      on_email: (e) => this.setState({ email: e.target.value.slice(0, 80) }),
      on_city: (e) => this.setState({ city: e.target.value.slice(0, 60) }),
      orbitOn: orbit, groundOn: !orbit,
      orbitBg: orbit ? 'rgba(255, 255, 255, 0.14)' : 'transparent',
      groundBg: orbit ? 'transparent' : 'rgba(255, 255, 255, 0.14)',
      orbitText: orbit ? '#ffffff' : '#a7b2b0',
      groundText: orbit ? '#a7b2b0' : '#ffffff',
      orbitIcon: orbit ? '#83ffe5' : '#a7b2b0',
      pickOrbit: () => this.setState({ view: 'orbit' }),
      pickGround: () => this.setState({ view: 'ground' }),
      tones: ['Balanced', 'Poetic', 'Scientific', 'Whisper'].map((label, i) => ({
        label: label, on: s.tone === i,
        bg: s.tone === i ? 'rgba(255, 255, 255, 0.14)' : 'rgba(255, 255, 255, 0.08)',
        color: s.tone === i ? '#ffffff' : '#a7b2b0',
        icon: s.tone === i ? '#83ffe5' : '#a7b2b0',
        pick: () => this.setState({ tone: i }),
      })),
      toggle_voice: () => this.setState((st) => ({ voice: !st.voice })),
      toggle_haptics: () => this.setState((st) => ({ haptics: !st.haptics })),
    };
    var v = this.sw(s.voice), hp = this.sw(s.haptics);
    Object.keys(v).forEach((k) => { vals['voice' + k] = v[k]; vals['haptics' + k] = hp[k]; });
    return vals;
  }
}
</script>
</body>
