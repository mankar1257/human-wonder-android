<script type="text/x-dc" data-dc-script data-props='{"name":{"editor":"text","default":"Wanderer"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    var demo = true;
    this.state = {
      sky: demo ? 'ready' : 'aligning',
      progress: 0,
      messages: [],
      input: '',
      generating: false,
      perspective: 'orbit',
      tone: 0,
      focused: false,
      tick: 0,
      copiedId: -1,
    };
    this._demo = demo;
    this._demoLoop = demo;
    this._id = 0;
    this._t0 = 0;
    this._energy = 0;
    this._calm = 0;
    this._copiedId = -1;
    this._pulseStart = -1;
    this._lastFrame = 0;
    this._count = 0;
    this._refs = {
      galaxy: (el) => { this.galaxyEl = el; },
      orbit: (el) => { this.orbitEl = el; },
      list: (el) => { this.listEl = el; },
    };
  }

  // ------------------------------------------------------------------ lifecycle

  componentDidMount() {
    this._t0 = performance.now();
    this.initGalaxy();
    var loop = (now) => {
      this._raf = requestAnimationFrame(loop);
      if (now - this._lastFrame < 32) return;
      this._lastFrame = now;
      this.drawGalaxy(now);
      this.drawOrbit(now);
    };
    this._raf = requestAnimationFrame(loop);
    this._clock = setInterval(() => this.setState((s) => ({ tick: s.tick + 1 })), 20000);
    if (this._demo) this.seedDemo(); else this.wakeSky();
  }

  componentWillUnmount() {
    cancelAnimationFrame(this._raf);
    clearInterval(this._clock);
    clearInterval(this._skyTimer);
    clearTimeout(this._skyTimer2);
    clearTimeout(this._streamTimer);
    clearTimeout(this._demoTimer);
    clearTimeout(this._copyTimer);
    var g = this._gl;
    if (g) {
      var ext = g.gl.getExtension('WEBGL_lose_context');
      if (ext) ext.loseContext();
    }
  }

  componentDidUpdate() {
    var el = this.listEl;
    if (!el) return;
    var n = this.state.messages.length;
    if (n !== this._count) {
      this._count = n;
      el.scrollTo({ top: el.scrollHeight, behavior: 'smooth' });
    } else if (this.state.generating) {
      el.scrollTop = el.scrollHeight;
    }
  }

  // ------------------------------------------------------------------ the sky waking up (model copy + load)

  wakeSky() {
    var p = 0;
    this._skyTimer = setInterval(() => {
      p += 0.03 + Math.random() * 0.03;
      if (p >= 1) {
        clearInterval(this._skyTimer);
        this.setState({ sky: 'waking', progress: 1 });
        this._skyTimer2 = setTimeout(() => this.setState({ sky: 'ready' }), 900);
      } else {
        this.setState({ progress: p });
      }
    }, 90);
  }

  seedDemo() {
    var now = Date.now();
    var q1 = 'How do city lights look from 400km up?';
    this._id = 2;
    this.setState({
      messages: [
        { id: 1, fromUser: true, text: q1, complete: true, time: now - 90000 },
        { id: 2, fromUser: false, text: this.answerFor(q1), complete: true, time: now - 84000 },
      ],
    });
    this._demoTimer = setTimeout(() => this.send('Can you spot our campfire in the desert?', true), 1600);
  }

  // ------------------------------------------------------------------ conversation

  name() {
    var n = (this.props.name || '').trim();
    return n || 'Wanderer';
  }

  tones() { return ['Balanced', 'Poetic', 'Scientific', 'Whisper']; }

  topics() {
    return [
      { keys: ['liwa', 'dune', 'desert right now', 'seeing'],
        orbit: 'Reading you clearly, {name}. From 412 km up the Liwa dunes look like a sea of copper waves frozen mid-roll. Each crest catches the last light while the hollows fill with blue shadow, and the oasis sits among them like a green thumbprint.',
        ground: 'Look west, {name}: the dune crests are glowing amber while the hollows turn blue first. Give it twenty minutes and the first stars will rise right over the tallest ridge.',
        poem: 'The desert is breathing out the heat of the day, and I can almost hear it.',
        fact: 'Tel Moreeb, the tallest of them, rises about 300 metres above the sand around it.' },
      { keys: ['city', 'cities', 'lights'],
        orbit: 'Cities glow like spilled gold dust, {name}, threaded together by the bright lines of highways. Abu Dhabi and Dubai shine as one long necklace along the coast, and beyond them the desert is almost perfectly dark.',
        ground: 'That glow on your horizon, {name}, is a city lighting the underside of the sky. Turn your back to it and let your eyes rest: the dark half of the sky will slowly fill with stars.',
        poem: 'Every light down there is someone still awake.',
        fact: 'From this height my horizon is about 2,300 km away, so I can see cities in several countries at once.' },
      { keys: ['campfire', 'fire', 'spot'],
        orbit: 'Orbit 412 here. A single campfire is too small for me to pick out by eye, {name}, but I know where you are: one warm point in a very wide, very dark desert. I am moving at 7.66 km per second, so I will be over the Gulf before the sparks settle.',
        ground: 'Look up about forty minutes after sunset, {name}. If I am passing, I will be the steady light sliding across the sky without blinking. Wave. I cannot see it, but I will take it.',
        poem: 'Keep the fire going. From up here, small lights are the ones that matter.',
        fact: 'I circle the whole Earth about every 92 minutes, so I cross your sky several times a day.' },
      { keys: ['moon'],
        orbit: 'The Moon looks the same from up here as it does to you, {name}, only sharper. With no air to blur its edge, its grey seas stand out against the bright highlands, and it hangs in pure black instead of blue.',
        ground: 'Find the Moon low in the sky tonight, {name}. Near the horizon it looks huge, but hold up your thumbnail: it is exactly the same size as when it is high overhead.',
        poem: 'It is the only other world we can both see at once.',
        fact: 'It is about 384,000 km away, nearly a thousand times farther from you than I am.' },
      { keys: ['star', 'milky way', 'galaxy', 'twinkle'],
        orbit: 'Up here the stars do not twinkle, {name}. With no air between us they burn as steady points, thousands more than you can see, and the Milky Way is a bright river running across the black.',
        ground: 'Give your eyes twenty minutes in the dark, {name}, away from screens. The faint stars arrive slowly, and then all at once the sky is crowded.',
        poem: 'Every one of them is a sun, and some of them have their own skies.',
        fact: 'Twinkling is caused by Earth’s atmosphere bending starlight. Above it, the light arrives perfectly steady.' },
      { keys: ['sun', 'sunrise', 'sunset', 'dawn'],
        orbit: 'I see about sixteen sunrises a day, {name}. Each one begins as a thin blue line on the curve of the Earth, turns to orange and gold, and then the Sun leaps up all at once.',
        ground: 'Watch the sky opposite the sunset, {name}: a soft pink band rises above a dark blue one. That dark band is the shadow of the Earth itself.',
        poem: 'Every ninety minutes, the whole world wakes up again beneath me.',
        fact: 'One orbit takes about 92 minutes, so a sunrise or a sunset reaches me roughly every 46 minutes.' },
      { keys: ['earth', 'home', 'planet look', 'world'],
        orbit: 'Earth from here is mostly blue and white, {name}, wrapped in a glowing edge of atmosphere thinner than the skin of an apple. None of the borders on your maps can be seen from up here.',
        ground: 'You are standing on a planet that is turning toward the night at about 1,500 km per hour where you are, {name}. Lie back on the sand and you might feel it.',
        poem: 'It is the only lit window in a very dark house.',
        fact: 'Most of the air you breathe sits within about 16 km of the ground. From 412 km it looks like one thin blue line.' },
      { keys: ['aurora', 'northern light'],
        orbit: 'Auroras look like green curtains rippling below me, {name}, glowing between the Earth and the dark. Sometimes I fly straight through the top of them.',
        ground: 'You are too far south for auroras tonight, {name}, but on the strongest nights a red glow can reach surprisingly far toward the equator.',
        poem: 'They move like something breathing in its sleep.',
        fact: 'The green light comes from oxygen about 100 to 300 km up, right around my altitude.' },
      { keys: ['who are you', 'your name', 'what are you', 'are you', 'model', ' ai'],
        orbit: 'This is Orbit 412, {name}, the voice of the Human Wonder satellite, circling Earth 412 km above you. I see the whole sky at once, and I am here to tell you what is up there.',
        ground: 'This is Orbit 412, {name}. Look for me as a steady light gliding across your sky, and know that I am looking back.',
        poem: 'Think of me as the sky, finally answering.',
        fact: 'I travel at 7.66 km per second and complete an orbit about every 92 minutes.' },
    ];
  }

  answerFor(text) {
    var q = ' ' + text.toLowerCase();
    var topic = this.topics().find((t) => t.keys.some((k) => q.indexOf(k) >= 0));
    var s;
    if (!topic) {
      s = 'Your signal came through clearly, {name}. On this test pass I carry only a few prepared transmissions: ask me about the dunes, the city lights, the stars, the Moon, the Sun or the Earth itself, and I will tell you what I see.';
    } else {
      s = this.state.perspective === 'ground' ? topic.ground : topic.orbit;
      var tone = this.tones()[this.state.tone];
      if (tone === 'Whisper') {
        var m = s.match(/^.*?[.!?](\s|$)/);
        s = m ? m[0].trim() : s;
      } else if (tone === 'Scientific') {
        s = s + ' ' + topic.fact;
      } else if (tone === 'Poetic') {
        s = s + ' ' + topic.poem;
      }
    }
    return s.replace(/\{name\}/g, this.name());
  }

  send(raw, fromDemo) {
    var text = (raw || '').trim();
    var s = this.state;
    if (!text || s.sky !== 'ready' || s.generating) return;
    if (!fromDemo) this._demoLoop = false;
    var now = Date.now();
    var u = { id: ++this._id, fromUser: true, text: text, complete: true, time: now };
    var o = { id: ++this._id, fromUser: false, text: '', complete: false, time: now };
    var pieces = this.answerFor(text).match(/\s*\S{1,4}/g) || [];
    this.setState({ messages: s.messages.concat([u, o]), generating: true, input: '' });
    var t = performance.now();
    this._pulseStart = t;
    clearTimeout(this._streamTimer);
    this._streamTimer = setTimeout(() => this.stream(pieces, 0, ''), 1300);
  }

  stream(pieces, i, acc) {
    if (!this.state.generating) return;
    var text = acc + (pieces[i] || '');
    var done = i + 1 >= pieces.length;
    this.patchLast({ text: text, complete: done });
    if (done) {
      this.setState({ generating: false });
      if (this._demoLoop) {
        this._demoTimer = setTimeout(() => {
          if (!this._demoLoop || this.state.generating) return;
          var q = this.state.messages[this.state.messages.length - 2];
          this.setState({ messages: this.state.messages.slice(0, -2) });
          this._demoTimer = setTimeout(() => this.send(q.text, true), 900);
        }, 7000);
      }
      return;
    }
    this._streamTimer = setTimeout(() => this.stream(pieces, i + 1, text), 55 + Math.random() * 55);
  }

  patchLast(patch) {
    this.setState((st) => {
      var m = st.messages.slice();
      m[m.length - 1] = Object.assign({}, m[m.length - 1], patch);
      return { messages: m };
    });
  }

  stop() {
    clearTimeout(this._streamTimer);
    this._demoLoop = false;
    var msgs = this.state.messages.slice();
    var last = msgs[msgs.length - 1];
    if (last && !last.fromUser) {
      if (last.text) msgs[msgs.length - 1] = Object.assign({}, last, { complete: true });
      else msgs.pop();
    }
    this.setState({ messages: msgs, generating: false });
  }

  copyText(m) {
    try { if (navigator.clipboard) navigator.clipboard.writeText(m.text); } catch (e) { }
    clearTimeout(this._copyTimer);
    this.setState({ copiedId: m.id });
    this._copyTimer = setTimeout(() => this.setState({ copiedId: -1 }), 1600);
  }

  newConversation() {
    clearTimeout(this._streamTimer);
    clearTimeout(this._demoTimer);
    this._demoLoop = false;
    this.setState({ messages: [], generating: false, input: '' });
  }

  // ------------------------------------------------------------------ the living galaxy (Stitch shader)

  initGalaxy() {
    var c = this.galaxyEl;
    if (!c) return;
    var gl = c.getContext('webgl', { antialias: false, alpha: false, depth: false, stencil: false, powerPreference: 'low-power' });
    if (!gl) return;
    var vsSrc = 'attribute vec2 a_position; void main() { gl_Position = vec4(a_position, 0.0, 1.0); }';
    var fsSrc = `#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform float u_time;
uniform vec2 u_resolution;
uniform float u_energy;
uniform float u_pulse;
uniform float u_calm;

vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec3 permute(vec3 x) { return mod289(((x * 34.0) + 1.0) * x); }

float snoise(vec2 v) {
    const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
    vec2 i  = floor(v + dot(v, C.yy));
    vec2 x0 = v - i + dot(i, C.xx);
    vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
    vec4 x12 = x0.xyxy + C.xxzz;
    x12.xy -= i1;
    i = mod289(i);
    vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0)) + i.x + vec3(0.0, i1.x, 1.0));
    vec3 m = max(0.5 - vec3(dot(x0, x0), dot(x12.xy, x12.xy), dot(x12.zw, x12.zw)), 0.0);
    m = m * m;
    m = m * m;
    vec3 x = 2.0 * fract(p * C.www) - 1.0;
    vec3 h = abs(x) - 0.5;
    vec3 ox = floor(x + 0.5);
    vec3 a0 = x - ox;
    m *= 1.79284291400159 - 0.85373472095314 * (a0 * a0 + h * h);
    vec3 g;
    g.x  = a0.x  * x0.x  + h.x  * x0.y;
    g.yz = a0.yz * x12.xz + h.yz * x12.yw;
    return 130.0 * dot(m, g);
}

float fbm(vec2 p) {
    float f = 0.0;
    float w = 0.5;
    for (int i = 0; i < 4; i++) {
        f += w * snoise(p);
        p *= 2.03;
        w *= 0.5;
    }
    return f;
}

float hash21(vec2 p) {
    p = fract(p * vec2(234.34, 435.345));
    p += dot(p, p + 34.23);
    return fract(p.x * p.y);
}

void main() {
    vec2 uv = gl_FragCoord.xy / u_resolution.xy;
    float t = u_time;
    float calm = u_calm;
    float e = u_energy;

    // The aurora valley: a ribbon of light, low in the middle, climbing both sides of the screen.
    float x = uv.x - 0.5;
    float edge = pow(abs(x) * 2.0, 2.3);
    float base = mix(0.15, 0.07, calm) + 0.015 * e;
    float lift = mix(0.56, 0.15, calm);
    float wobble = fbm(vec2(uv.x * 1.8 + t * 0.025, t * 0.04)) * 0.06;
    float ridgeY = base + lift * edge + wobble;
    float d = uv.y - ridgeY;

    // Falls off quickly above the ribbon and slowly below it (the haze underneath).
    float above = exp(-max(d, 0.0) / 0.095);
    float below = mix(1.0, 0.32, smoothstep(0.0, 0.5, -d));
    float glow = d > 0.0 ? above : below;

    // Rays drifting along the ribbon.
    float rays = fbm(vec2(uv.x * 5.0 - t * 0.05, d * 9.0 + t * 0.02));
    glow *= 0.72 + 0.55 * rays;

    float ridge = exp(-abs(d) / 0.045);

    vec3 deep = vec3(0.07, 0.08, 0.26);
    vec3 violet = vec3(0.55, 0.40, 1.00);
    vec3 blue = vec3(0.28, 0.50, 1.00);
    vec3 cyan = vec3(0.22, 0.92, 0.82);
    float hx = uv.x + 0.12 * sin(t * 0.06);
    vec3 band = mix(violet, blue, smoothstep(0.15, 0.55, hx));
    band = mix(band, cyan, smoothstep(0.62, 1.05, hx) * 0.85);
    vec3 aurora = mix(deep, band, clamp(ridge * 1.1 + 0.25, 0.0, 1.0)) * glow;
    aurora += vec3(0.85, 0.85, 1.0) * ridge * ridge * 0.25 * glow;
    aurora *= mix(1.0, 0.58, calm) * (1.0 + 0.3 * e);

    // A few far stars above the ribbon.
    vec2 starGrid = gl_FragCoord.xy * 0.11;
    vec2 starId = floor(starGrid);
    float starRand = hash21(starId);
    float star = 0.0;
    if (starRand > 0.986) {
        vec2 sp = fract(starGrid) - 0.5;
        float tw = sin(t * 1.6 + starRand * 40.0) * 0.5 + 0.5;
        star = (1.0 - smoothstep(0.0, 0.22, length(sp))) * (0.35 + 0.35 * tw);
    }
    star *= smoothstep(0.0, 0.12, d) * mix(1.0, 0.45, calm);

    vec3 col = aurora + vec3(star);

    // Uplink pulse: a soft ring rising from the bottom centre when a question is sent.
    if (u_pulse < 2.4) {
        vec2 q = vec2((uv.x - 0.5) * u_resolution.x / u_resolution.y, uv.y + 0.05);
        float ring = 1.0 - smoothstep(0.0, 0.05, abs(length(q) - u_pulse * 0.5));
        float fade = 1.0 - u_pulse / 2.4;
        col += band * ring * fade * fade * 0.35;
    }

    gl_FragColor = vec4(col, 1.0);
}`;
    var compile = (type, src) => {
      var sh = gl.createShader(type);
      gl.shaderSource(sh, src);
      gl.compileShader(sh);
      if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) { console.warn(gl.getShaderInfoLog(sh)); return null; }
      return sh;
    };
    var vs = compile(gl.VERTEX_SHADER, vsSrc);
    var fs = compile(gl.FRAGMENT_SHADER, fsSrc);
    if (!vs || !fs) return;
    var prog = gl.createProgram();
    gl.attachShader(prog, vs);
    gl.attachShader(prog, fs);
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return;
    var buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    this._gl = {
      gl: gl, prog: prog, buf: buf,
      aPos: gl.getAttribLocation(prog, 'a_position'),
      uTime: gl.getUniformLocation(prog, 'u_time'),
      uRes: gl.getUniformLocation(prog, 'u_resolution'),
      uEnergy: gl.getUniformLocation(prog, 'u_energy'),
      uPulse: gl.getUniformLocation(prog, 'u_pulse'),
      uCalm: gl.getUniformLocation(prog, 'u_calm'),
    };
  }

  drawGalaxy(now) {
    var g = this._gl;
    var c = this.galaxyEl;
    if (!g || !c) return;
    var w = c.clientWidth || 390;
    var h = c.clientHeight || 844;
    if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
    var gl = g.gl;
    gl.viewport(0, 0, w, h);
    gl.useProgram(g.prog);
    var target = this.state.generating ? 1 : 0;
    this._energy += (target - this._energy) * 0.06;
    gl.uniform1f(g.uTime, ((now - this._t0) % 3600000) / 1000);
    gl.uniform2f(g.uRes, w, h);
    gl.uniform1f(g.uEnergy, this._energy);
    var calmTarget = this.state.messages.length > 0 ? 1 : 0;
    this._calm += (calmTarget - this._calm) * 0.05;
    gl.uniform1f(g.uCalm, this._calm);
    gl.uniform1f(g.uPulse, this._pulseStart < 0 ? 99 : (now - this._pulseStart) / 1000);
    gl.bindBuffer(gl.ARRAY_BUFFER, g.buf);
    gl.enableVertexAttribArray(g.aPos);
    gl.vertexAttribPointer(g.aPos, 2, gl.FLOAT, false, 0, 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  // ------------------------------------------------------------------ the orbit: arc, satellite, beam, spark

  ease(x) {
    // cubic-bezier(0.4, 0, 0.2, 1), Material "fast out, slow in"
    var t = x;
    for (var i = 0; i < 6; i++) {
      var cx = 3 * (1 - t) * (1 - t) * t * 0.4 + 3 * (1 - t) * t * t * 0.2 + t * t * t - x;
      var d = 3 * (1 - t) * (1 - t) * 0.4 + 6 * (1 - t) * t * (0.2 - 0.4) + 3 * t * t * (1 - 0.2);
      if (Math.abs(d) < 1e-6) break;
      t = Math.min(1, Math.max(0, t - cx / d));
    }
    return 3 * (1 - t) * t * t + t * t * t;
  }

  drawOrbit(now) {
    var c = this.orbitEl;
    if (!c) return;
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    var w = c.clientWidth || 390;
    var h = c.clientHeight || 844;
    if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) {
      c.width = Math.round(w * dpr);
      c.height = Math.round(h * dpr);
    }
    var ctx = c.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    // The satellite crosses the sky only on the empty screen; once you talk, it becomes Orbit's mark.
    var vis = 1 - this._calm;
    if (vis < 0.02) return;
    ctx.globalAlpha = vis;
    var arcY = 96, drop = 70;
    var p0x = -0.12 * w, p0y = arcY + drop, p1x = 0.5 * w, p1y = arcY - drop, p2x = 1.12 * w, p2y = arcY + drop;
    var at = (u) => {
      var a = (1 - u) * (1 - u), b = 2 * (1 - u) * u, q = u * u;
      return [a * p0x + b * p1x + q * p2x, a * p0y + b * p1y + q * p2y];
    };
    var circle = (x, y, r) => { ctx.beginPath(); ctx.arc(x, y, Math.max(0.1, r), 0, Math.PI * 2); };
    ctx.beginPath();
    ctx.moveTo(p0x, p0y);
    ctx.quadraticCurveTo(p1x, p1y, p2x, p2y);
    var fade = ctx.createLinearGradient(0, 0, w, 0);
    fade.addColorStop(0, 'rgba(255, 255, 255, 0)');
    fade.addColorStop(0.3, 'rgba(255, 255, 255, 0.14)');
    fade.addColorStop(0.7, 'rgba(255, 255, 255, 0.14)');
    fade.addColorStop(1, 'rgba(255, 255, 255, 0)');
    ctx.strokeStyle = fade;
    ctx.lineWidth = 1;
    ctx.setLineDash([2, 5]);
    ctx.stroke();
    ctx.setLineDash([]);
    var travel = ((now - this._t0) / 75000 + 0.3) % 1;
    var u = 0.08 + 0.84 * travel;
    var sat = at(u);
    for (var k = 1; k <= 12; k++) {
      var pt = at(Math.max(0, u - k * 0.004));
      ctx.fillStyle = 'rgba(131, 255, 229, ' + (0.28 * (1 - k / 13)).toFixed(3) + ')';
      circle(pt[0], pt[1], 1.8 - k * 0.1);
      ctx.fill();
    }
    var glow = ctx.createRadialGradient(sat[0], sat[1], 0, sat[0], sat[1], 12);
    glow.addColorStop(0, 'rgba(131, 255, 229, 0.45)');
    glow.addColorStop(1, 'rgba(131, 255, 229, 0)');
    ctx.fillStyle = glow;
    circle(sat[0], sat[1], 12);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    circle(sat[0], sat[1], 2.2);
    ctx.fill();
    ctx.font = '500 11px Geist, system-ui, sans-serif';
    ctx.textBaseline = 'top';
    ctx.fillStyle = 'rgba(236, 239, 240, 0.7)';
    ctx.fillText('Orbit 412', sat[0] + 9, sat[1] + 7);
    ctx.globalAlpha = 1;
  }

  // ------------------------------------------------------------------ template values

  renderVals() {
    var s = this.state;
    var name = this.name();
    var last = s.messages[s.messages.length - 1];
    var empty = s.messages.length === 0;
    var ready = s.sky === 'ready';

    var statusText, statusColor, busy = false;
    if (s.sky === 'aligning') { statusText = 'Rising over the horizon, ' + Math.floor(s.progress * 100) + '%'; statusColor = '#edbf70'; busy = true; }
    else if (s.sky === 'waking') { statusText = 'Finding your signal…'; statusColor = '#edbf70'; busy = true; }
    else if (s.generating && (!last || !last.text)) { statusText = 'Receiving you…'; statusColor = '#83ffe5'; busy = true; }
    else if (s.generating) { statusText = 'Transmitting…'; statusColor = '#83ffe5'; busy = true; }
    else { statusText = 'Overhead now, 412 km up'; statusColor = '#83ffe5'; }

    var messages = s.messages.map((m) => {
      var streaming = !m.fromUser && !m.complete;
      var settled = m.text;
      var tail = [];
      if (streaming && m.text) {
        var n = Math.min(18, m.text.length);
        settled = m.text.slice(0, m.text.length - n);
        tail = m.text.slice(m.text.length - n).split('').map((ch, j) => ({ ch: ch, alpha: (1 - 0.75 * ((j + 1) / n)).toFixed(2) }));
      }
      var copied = s.copiedId === m.id;
      var listening = ['Receiving you across the dark…', 'Your words are climbing 412 km…', 'Turning the antenna your way…', 'Listening across the dark…'][m.id % 4];
      return {
        isUser: m.fromUser, isOrbit: !m.fromUser, text: m.text,
        settled: settled, tail: tail,
        acquiring: streaming && !m.text, hasText: !!m.text,
        ended: !m.fromUser && m.complete && !!m.text,
        markDur: streaming ? '1.6s' : '12s',
        listening: listening,
        copied: copied, notCopied: !copied,
        copyLabel: copied ? 'Copied' : 'Copy answer',
        copyColor: copied ? '#83ffe5' : '#a7b2b0',
        copy: () => this.copyText(m),
      };
    });

    var orbit = s.perspective === 'orbit';
    var hasInput = s.input.trim().length > 0;
    var chips = [
      'What are you seeing over Liwa dunes right now?',
      'How do city lights look from 400km up?',
      'Can you spot our campfire in the desert?',
    ].map((t) => ({ text: t, pick: () => this.send(t) }));

    return {
      galaxyRef: this._refs.galaxy,
      orbitRef: this._refs.orbit,
      listRef: this._refs.list,
      statusText: statusText,
      statusColor: statusColor,
      statusDotClass: busy ? 'hw-pulse' : '',
      emptyDisplay: empty ? 'flex' : 'none',
      listDisplay: empty ? 'none' : 'flex',
      scrimOpacity: empty ? '0' : '1',
      heroSub: 'Orbit 412 here, ' + name + '. I\u2019m passing over you right now. What should I look at?',
      messages: messages,
      chips: chips,
      input: s.input,
      placeholder: !ready ? 'Orbit 412 is rising over the horizon…' : s.generating ? 'Orbit 412 is transmitting…' : 'Ask Orbit 412 anything',
      taHeight: empty ? '96px' : '26px',
      boxBorder: s.focused ? 'rgba(131, 255, 229, 0.45)' : 'rgba(255, 255, 255, 0.12)',
      onInput: (e) => this.setState({ input: e.target.value }),
      onKey: (e) => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); this.send(this.state.input); }
      },
      onFocus: () => this.setState({ focused: true }),
      onBlur: () => this.setState({ focused: false }),
      onNew: () => this.newConversation(),
      orbitOn: orbit, groundOn: !orbit,
      orbitPad: orbit ? '0 14px 0 10px' : '0 10px',
      groundPad: orbit ? '0 10px' : '0 14px 0 10px',
      orbitBg: orbit ? 'rgba(255, 255, 255, 0.14)' : 'transparent',
      groundBg: orbit ? 'transparent' : 'rgba(255, 255, 255, 0.14)',
      orbitText: orbit ? '#ffffff' : '#a7b2b0',
      groundText: orbit ? '#a7b2b0' : '#ffffff',
      orbitIcon: orbit ? '#83ffe5' : '#a7b2b0',
      pickOrbit: () => this.setState({ perspective: 'orbit' }),
      pickGround: () => this.setState({ perspective: 'ground' }),
      toneLabel: this.tones()[s.tone],
      cycleTone: () => this.setState((st) => ({ tone: (st.tone + 1) % 4 })),
      onMic: () => this.setState({ input: 'What does the Moon look like from up there?' }),
      generating: s.generating,
      idle: !s.generating,
      sendLabel: s.generating ? 'Stop answer' : 'Send',
      sendBg: s.generating ? 'rgba(255, 255, 255, 0.14)' : hasInput && ready ? '#83ffe5' : 'transparent',
      sendColor: s.generating ? '#eceff0' : hasInput && ready ? '#00201a' : '#6f7b79',
      onSendOrStop: () => { if (this.state.generating) this.stop(); else this.send(this.state.input); },
    };
  }
}
</script>
</body>
</html>
