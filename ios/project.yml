# Human Wonder for iPhone. Generate the Xcode project with XcodeGen (`xcodegen generate` in ios/);
# the GitHub workflow .github/workflows/ios.yml builds it on a Mac and makes the .ipa.
name: HumanWonder
options:
  bundleIdPrefix: ai.humanwonder
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  HumanWonder:
    type: application
    platform: iOS
    sources:
      - path: HumanWonder
        excludes:
          - "Resources/licenses"
          - "Resources/licenses/**"
          - "Model"
          - "Model/**"
          - "Info.plist"
      - path: HumanWonder/Resources/licenses
        type: folder
        buildPhase: resources
      - path: HumanWonder/Model/hw-core.gguf
        buildPhase: resources
        optional: true
    dependencies:
      - framework: ../third_party/llama.cpp/build-apple/llama.xcframework
        embed: true
        codeSign: false
    info:
      path: HumanWonder/Info.plist
      properties:
        CFBundleDisplayName: Human Wonder
        CFBundleName: Human Wonder
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIUserInterfaceStyle: Dark
        UIAppFonts:
          - HWGeist-Light.ttf
          - HWGeist-Regular.ttf
          - HWGeist-Medium.ttf
          - HWGeist-SemiBold.ttf
          - HWNewsreader-Regular.ttf
          - HWMono-Regular.ttf
          - HWMono-Medium.ttf
        NSMicrophoneUsageDescription: Speak your question to Orbit 412.
        NSSpeechRecognitionUsageDescription: Turns what you say into a question for Orbit 412, on this phone only.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.humanwonder.orbit
        PRODUCT_NAME: HumanWonder
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: NO
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks"]
