# Human Wonder for iPhone. Generate the Xcode project with XcodeGen (`xcodegen generate` in ios/).
# Built on the Mac by tools/build-ios-on-mac.sh ("Build Human Wonder for iPhone.command"), or by the
# GitHub workflow .github/workflows/ios.yml. No asset catalog on purpose: compiling one makes Xcode
# require an 8 GB simulator download. Without Xcode's Metal toolchain the build script swaps the
# "UI/Aurora.metal.excluded" pattern for the shader and HW_METAL for HW_NO_METAL.
name: HumanWonder
options:
  bundleIdPrefix: ai.humanwonder
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
targets:
  HumanWonder:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: HumanWonder
        excludes:
          - "Resources/licenses"
          - "Resources/licenses/**"
          - "Model"
          - "Model/**"
          - "Info.plist"
          - "UI/Aurora.metal.excluded"
      - path: HumanWonder/Resources/licenses
        type: folder
        buildPhase: resources
      - path: HumanWonder/Model/hw-core.gguf
        buildPhase: resources
        optional: true
    dependencies:
      - framework: ../third_party/llama.cpp/build-apple/llama.xcframework
        embed: true
        codeSign: false
    info:
      path: HumanWonder/Info.plist
      properties:
        CFBundleDisplayName: Human Wonder
        CFBundleName: Human Wonder
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles: [AppIcon60x60]
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIUserInterfaceStyle: Dark
        UIAppFonts:
          - HWGeist-Light.ttf
          - HWGeist-Regular.ttf
          - HWGeist-Medium.ttf
          - HWGeist-SemiBold.ttf
          - HWNewsreader-Regular.ttf
          - HWMono-Regular.ttf
          - HWMono-Medium.ttf
        NSMicrophoneUsageDescription: Speak your question to Orbit 412.
        NSSpeechRecognitionUsageDescription: Turns what you say into a question for Orbit 412, on this phone only.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.humanwonder.orbit
        PRODUCT_NAME: HumanWonder
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: ["$(inherited)", HW_METAL]
        ENABLE_PREVIEWS: NO
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks"]
